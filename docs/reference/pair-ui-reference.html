<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pair — Interactive Product Prototype</title>
<style>
:root{
  --ink:#123438;--muted:#60777a;--bg:#eff8f6;--card:#fff;
  --soft:#dff3ee;--line:#cde2de;--brand:#087b76;--brand2:#229b8b;
  --gold:#edb64e;--goldsoft:#fae9bd;--shadow:0 18px 45px #315f5917;
}
*{box-sizing:border-box}
body{
  margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,
  BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
body:before,body:after{
  content:"";position:fixed;border-radius:50%;z-index:-1;pointer-events:none
}
body:before{
  width:420px;height:420px;right:-150px;top:-160px;background:var(--goldsoft)
}
body:after{
  width:520px;height:520px;left:-280px;bottom:-300px;background:var(--soft)
}
.topbar{
  height:72px;padding:0 28px;display:flex;align-items:center;
  justify-content:space-between;background:#ffffffeb;backdrop-filter:blur(18px);
  border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20
}
.brand{display:flex;align-items:center;gap:11px;font-size:1.25rem;font-weight:900}
.mark{
  width:39px;height:39px;border-radius:13px;display:grid;place-items:center;
  color:white;background:linear-gradient(145deg,var(--brand),var(--brand2))
}
.top-actions,.actions{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.btn{
  border:0;border-radius:14px;padding:12px 17px;background:var(--brand);
  color:white;font-weight:800
}
.btn.secondary{background:var(--card);color:var(--brand);border:1px solid var(--line)}
.btn.soft{background:var(--soft);color:var(--brand)}
.layout{display:grid;grid-template-columns:255px minmax(0,1fr);min-height:calc(100vh - 72px)}
.sidebar{
  padding:27px 17px;border-right:1px solid var(--line);background:#f9fdfcbd;
  position:sticky;top:72px;height:calc(100vh - 72px);overflow:auto
}
.identity{padding:8px 12px 22px}
.eyebrow{
  font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;
  font-weight:900;color:var(--brand)
}
.identity h3{margin:6px 0 3px}
.muted,.identity p{color:var(--muted)}
.identity p{margin:0;font-size:.85rem}
nav{display:grid;gap:7px}
nav button{
  padding:12px 14px;border:0;border-radius:14px;text-align:left;
  background:transparent;color:var(--muted);font-weight:750
}
nav button:hover,nav button.active{background:var(--soft);color:var(--brand)}
nav .icon{display:inline-block;width:28px;text-align:center}
.side-note{
  margin-top:25px;padding:17px;border-radius:20px;
  background:linear-gradient(145deg,var(--brand),#146b64);color:white
}
.side-note p{font-size:.82rem;line-height:1.5;color:#e5fffa}
main{width:100%;max-width:1480px;margin:auto;padding:35px clamp(22px,4vw,65px) 70px}
.screen-head{
  display:flex;justify-content:space-between;gap:20px;align-items:flex-start;
  margin-bottom:24px
}
.screen-head h1{
  margin:5px 0 7px;font-size:clamp(1.9rem,3vw,2.7rem);letter-spacing:-.045em
}
.screen-head p{margin:0;max-width:730px;line-height:1.5;color:var(--muted)}
.grid{display:grid;gap:20px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.span2{grid-column:span 2}
.card{
  padding:22px;border-radius:24px;background:var(--card);
  border:1px solid var(--line);box-shadow:var(--shadow)
}
.card h2,.card h3{margin:0 0 9px;letter-spacing:-.02em}
.card p{color:var(--muted);line-height:1.5}
.hero{
  min-height:275px;padding:38px;border-radius:32px;color:white;
  background:linear-gradient(125deg,var(--brand),#146e68 65%,#608e76);
  display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden
}
.hero:before,.hero:after{
  content:"";position:absolute;border-radius:50%;background:#ffffff1f
}
.hero:before{width:270px;height:270px;right:-50px;bottom:-150px}
.hero:after{width:180px;height:180px;right:90px;top:-110px;background:#f4d88742}
.hero h1{
  max-width:760px;margin:8px 0 12px;font-size:clamp(2.2rem,5vw,4rem);
  line-height:1.02;letter-spacing:-.06em;position:relative
}
.hero p{max-width:690px;font-size:1.08rem;color:#eafffb;position:relative}
.hero .actions{position:relative}
.hero .btn{background:white;color:var(--brand)}
.hero .btn.secondary{background:#ffffff18;color:white;border-color:#ffffff66}
.metric{display:flex;justify-content:space-between;align-items:center;gap:12px}
.num{font-size:2rem;font-weight:900;letter-spacing:-.05em}
.chip{
  display:inline-flex;padding:7px 11px;border-radius:999px;background:var(--soft);
  color:var(--brand);font-size:.77rem;font-weight:850
}
.chip.gold{background:var(--goldsoft);color:#715000}
.row{
  display:flex;align-items:center;justify-content:space-between;gap:14px;
  padding:15px 0;border-bottom:1px solid var(--line)
}
.row:last-child{border-bottom:0}
.row-main{display:flex;gap:13px;align-items:center}
.avatar{
  width:48px;height:48px;border-radius:17px;display:grid;place-items:center;
  flex:none;background:var(--soft);color:var(--brand);font-weight:900
}
.sub{font-size:.82rem;color:var(--muted);margin-top:4px}
.progress{height:10px;border-radius:999px;background:#e5eeee;overflow:hidden}
.progress span{
  display:block;height:100%;border-radius:999px;
  background:linear-gradient(90deg,var(--brand),var(--brand2))
}
.timeline-item{
  display:grid;grid-template-columns:76px 22px 1fr;gap:10px;min-height:83px
}
.time{font-size:.72rem;letter-spacing:.08em;font-weight:900;color:var(--brand)}
.line{position:relative}
.line:after{
  content:"";position:absolute;width:2px;background:var(--line);
  left:7px;top:14px;bottom:-14px
}
.timeline-item:last-child .line:after{display:none}
.dot{
  width:16px;height:16px;border-radius:50%;background:var(--brand);
  position:relative;z-index:2
}
.option-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.option{
  min-height:105px;padding:17px;text-align:left;border-radius:18px;
  border:2px solid var(--line);background:var(--card);color:var(--ink)
}
.option:hover,.option.selected{background:var(--soft);border-color:var(--brand)}
.option .big{font-size:1.55rem;display:block;margin-bottom:8px}
.field{display:grid;gap:7px;margin-bottom:16px}
.field label{font-size:.84rem;font-weight:850}
.field input,.field select,.field textarea{
  width:100%;padding:13px 14px;border:1.5px solid var(--line);
  border-radius:13px;background:#f7fbfa;color:var(--ink)
}
.field textarea{min-height:105px;resize:vertical}
.activity-step{
  display:flex;align-items:flex-start;gap:14px;padding:16px;margin-bottom:11px;
  border:1px solid var(--line);border-radius:18px;background:#f7fbfa
}
.step-number{
  width:32px;height:32px;border-radius:10px;display:grid;place-items:center;
  flex:none;background:var(--soft);color:var(--brand);font-weight:900
}
.notice{
  padding:15px 17px;border-left:4px solid var(--brand);
  border-radius:0 15px 15px 0;background:var(--soft)
}
.warning{
  padding:16px 18px;border-radius:18px;background:var(--goldsoft);
  color:#5f470c;border:1px solid #ecd38f
}
.privacy{
  display:flex;gap:10px;padding:15px 17px;border-radius:17px;
  background:#edf6fa;border:1px solid #cee1e8;color:#315963
}
.tabs{display:flex;gap:7px;overflow:auto;margin-bottom:20px}
.tab{
  border:1px solid var(--line);background:var(--card);color:var(--muted);
  padding:9px 14px;border-radius:999px;font-weight:800;white-space:nowrap
}
.tab.active{background:var(--ink);color:white}
.role-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:17px}
.role-card{
  padding:23px;text-align:left;border:1px solid var(--line);border-radius:24px;
  background:var(--card);color:var(--ink);transition:.2s
}
.role-card:hover{transform:translateY(-4px);box-shadow:var(--shadow);border-color:var(--brand)}
.role-icon{
  width:49px;height:49px;border-radius:17px;display:grid;place-items:center;
  background:var(--soft);font-size:1.4rem;margin-bottom:16px
}
.role-card p{font-size:.87rem;line-height:1.5;color:var(--muted)}
.toggle{
  width:49px;height:27px;padding:3px;border:0;border-radius:999px;background:#cbd8d6
}
.toggle:after{
  content:"";display:block;width:21px;height:21px;border-radius:50%;
  background:white;box-shadow:0 2px 5px #0002
}
.toggle.on{background:var(--brand)}
.toggle.on:after{transform:translateX(22px)}
.chart{height:170px;display:flex;align-items:flex-end;gap:9px}
.bar{
  flex:1;border-radius:9px 9px 3px 3px;
  background:linear-gradient(var(--brand2),var(--brand))
}
.landing{max-width:1250px;margin:auto;padding:40px 28px 70px}
.landing-nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:40px}
.landing .hero{min-height:440px;padding:55px}
.landing .hero h1{font-size:clamp(3rem,7vw,5.5rem)}
.feature-strip{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:20px}
.mobile-nav{display:none}
.modal-back{
  position:fixed;inset:0;z-index:50;display:grid;place-items:center;
  background:#112d2da6;backdrop-filter:blur(5px);padding:20px
}
.modal{
  width:min(590px,100%);max-height:90vh;overflow:auto;padding:28px;
  border-radius:28px;background:var(--card);box-shadow:0 30px 90px #0004
}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.close{
  width:39px;height:39px;border:0;border-radius:12px;background:var(--soft)
}
.toast{
  position:fixed;right:24px;bottom:24px;z-index:80;padding:14px 18px;
  border-radius:14px;background:var(--ink);color:white;box-shadow:var(--shadow)
}
body.garden{
  --bg:#f3f7ed;--card:#fffefa;--soft:#e4efd9;--line:#d9e3ce;
  --brand:#477a4c;--brand2:#78a45f;--gold:#d78c49;--goldsoft:#f6dfc5
}
body.twilight{
  --ink:#f4f7fa;--muted:#b9c5d1;--bg:#171e29;--card:#222b38;
  --soft:#2e4560;--line:#3b4859;--brand:#88bce9;--brand2:#a195e8;
  --gold:#ffd274;--goldsoft:#4b4438
}
body.twilight .topbar{background:#1d2632e8}
body.twilight .sidebar{background:#1b2430e6}
body.twilight .field input,
body.twilight .field select,
body.twilight .field textarea,
body.twilight .activity-step{background:#293443}
body.twilight .privacy{background:#25364a;color:#d4e7f2;border-color:#3c5771}
@media(max-width:1050px){
  .layout{grid-template-columns:215px 1fr}
  .g4{grid-template-columns:repeat(2,1fr)}
  .g3,.role-grid{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:760px){
  .topbar{padding:0 15px}.role-button{display:none}
  .layout{display:block}.sidebar{display:none}
  main{padding:22px 15px 90px}
  .g2,.g3,.g4,.role-grid,.feature-strip,.option-grid{grid-template-columns:1fr}
  .span2{grid-column:span 1}
  .screen-head{display:block}.screen-head .actions{margin-top:15px}
  .landing{padding:22px 15px 80px}.landing .hero{padding:30px;min-height:500px}
  .mobile-nav{
    display:flex;position:fixed;z-index:30;left:0;right:0;bottom:0;
    padding:8px;background:var(--card);border-top:1px solid var(--line);overflow:auto
  }
  .mobile-nav button{
    min-width:74px;flex:1;padding:7px 4px;border:0;border-radius:10px;
    background:transparent;color:var(--muted);font-size:.68rem
  }
  .mobile-nav button.active{background:var(--soft);color:var(--brand)}
  .mobile-nav .icon{display:block;font-size:1.1rem;margin-bottom:2px}
}
</style>
</head>
<body>
<div id="app"></div>
<script>
const roles={
  public:{
    label:"Public preview",person:"Visitor",
    pages:[
      ["landing","⌂","Landing"],
      ["roles","◫","Choose role"],
      ["signin","→","Sign in"]
    ]
  },
  member:{
    label:"Pair member",person:"Jordan Reyes",
    pages:[
      ["home","⌂","Home"],
      ["plan","☷","My plan"],
      ["checkin","♡","Check in"],
      ["patterns","⌁","Patterns"],
      ["appointments","✚","Appointments"],
      ["circle","◎","My circle"],
      ["member-settings","⚙","Settings"]
    ]
  },
  coach:{
    label:"Coach / educator",person:"Dana Brooks",
    pages:[
      ["coach-home","⌂","Overview"],
      ["learners","♙","Learners"],
      ["learner-detail","◉","Jordan"],
      ["library","▤","Activity library"],
      ["coach-settings","⚙","Settings"]
    ]
  },
  health:{
    label:"Healthcare professional",person:"Dr. Priya Patel",
    pages:[
      ["health-home","⌂","Shared with me"],
      ["packet","▧","Jordan’s packet"],
      ["nextsteps","✓","Next steps"],
      ["health-settings","⚙","Settings"]
    ]
  },
  trusted:{
    label:"Trusted person",person:"Marisol Reyes",
    pages:[
      ["trusted-home","⌂","Overview"],
      ["summary","◉","Shared summary"],
      ["trusted-settings","⚙","Settings"]
    ]
  },
  admin:{
    label:"Organization admin",person:"Alex Morgan",
    pages:[
      ["admin-home","⌂","Organization"],
      ["people","♙","People & roles"],
      ["audit","≡","Consent & audit"],
      ["admin-settings","⚙","Settings"]
    ]
  }
};

let state={role:"public",page:"landing",theme:"ocean",modal:null};
const app=document.getElementById("app");

function go(page){
  state.page=page;
  state.modal=null;
  render();
  scrollTo(0,0);
}
function setRole(role){
  state.role=role;
  state.page=roles[role].pages[0][0];
  state.modal=null;
  render();
}
function setTheme(theme){
  state.theme=theme;
  document.body.className=theme==="ocean"?"":theme;
  render();
}
function showModal(type){
  state.modal=type;
  render();
}
function closeModal(){
  state.modal=null;
  render();
}
function toast(message){
  const el=document.createElement("div");
  el.className="toast";
  el.textContent=message;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),2300);
}
function chip(text,type=""){
  return `<span class="chip ${type}">${text}</span>`;
}
function avatar(text){
  return `<span class="avatar">${text}</span>`;
}
function toggle(on=true){
  return `<button class="toggle ${on?"on":""}" onclick="this.classList.toggle('on')"></button>`;
}
function head(section,title,description,action=""){
  return `
    <div class="screen-head">
      <div>
        <div class="eyebrow">${section}</div>
        <h1>${title}</h1>
        <p>${description}</p>
      </div>
      ${action?`<div class="actions">${action}</div>`:""}
    </div>
  `;
}
function shell(content){
  const role=roles[state.role];
  return `
    <header class="topbar">
      <div class="brand" onclick="setRole('public')">
        <span class="mark">P</span>Pair
      </div>
      <div class="top-actions">
        <button class="btn secondary role-button" onclick="showModal('roles')">
          ${role.label} · Switch
        </button>
        <button class="btn soft" onclick="showModal('quick')">＋</button>
      </div>
    </header>
    <div class="layout">
      <aside class="sidebar">
        <div class="identity">
          <div class="eyebrow">${role.label}</div>
          <h3>${role.person}</h3>
          <p>${state.role==="member"?"Your information, your choices":"Role-based demonstration view"}</p>
        </div>
        <nav>
          ${role.pages.map(page=>`
            <button class="${state.page===page[0]?"active":""}" onclick="go('${page[0]}')">
              <span class="icon">${page[1]}</span>${page[2]}
            </button>
          `).join("")}
        </nav>
        ${state.role!=="public"?`
          <div class="side-note">
            <b>Pair keeps the member in control</b>
            <p>Access is based on the member’s choices, not simply a person’s job title.</p>
            <button class="btn secondary" onclick="showModal('permissions')">View access</button>
          </div>
        `:""}
      </aside>
      <main>${content}</main>
    </div>
    <div class="mobile-nav">
      ${role.pages.slice(0,5).map(page=>`
        <button class="${state.page===page[0]?"active":""}" onclick="go('${page[0]}')">
          <span class="icon">${page[1]}</span>${page[2]}
        </button>
      `).join("")}
    </div>
  `;
}

function landing(){
  return `
    <div class="landing">
      <div class="landing-nav">
        <div class="brand"><span class="mark">P</span>Pair</div>
        <div class="actions">
          <button class="btn secondary" onclick="go('signin')">Sign in</button>
          <button class="btn" onclick="go('roles')">Explore prototype</button>
        </div>
      </div>

      <section class="hero">
        <div class="eyebrow" style="color:#d8fff7">Independence, one clear step at a time</div>
        <h1>Understand what matters. Decide what comes next.</h1>
        <p>
          Pair helps neurodivergent young adults learn life skills,
          prepare for healthcare visits and turn important information
          into manageable next steps.
        </p>
        <div class="actions">
          <button class="btn" onclick="go('roles')">Explore each role</button>
          <button class="btn secondary" onclick="setRole('member')">View Jordan’s home</button>
        </div>
      </section>

      <div class="feature-strip">
        <div class="card">
          <div class="role-icon">◫</div>
          <h3>Information your way</h3>
          <p>Short sections, visual steps, read-aloud support and adjustable detail.</p>
        </div>
        <div class="card">
          <div class="role-icon">✓</div>
          <h3>One next step</h3>
          <p>Life-skills activities and healthcare follow-up become understandable actions.</p>
        </div>
        <div class="card">
          <div class="role-icon">◎</div>
          <h3>Sharing you control</h3>
          <p>The member decides what is shared, with whom and for how long.</p>
        </div>
      </div>
    </div>
  `;
}

function roleChooser(){
  const options=[
    ["member","◉","Pair member","Complete activities, notice personal patterns and manage sharing."],
    ["coach","▤","Coach or educator","Assign activities and see only learning-relevant progress."],
    ["health","✚","Healthcare professional","Review a submitted visit packet and propose follow-up steps."],
    ["trusted","◎","Trusted person","See only the summaries and actions shared by the member."],
    ["admin","⚙","Organization administrator","Manage accounts, roles and access records."]
  ];
  return shell(`
    ${head(
      "Prototype entry",
      "Whose view would you like to explore?",
      "Each person receives focused navigation and only the information needed for their role."
    )}
    <div class="role-grid">
      ${options.map(option=>`
        <button class="role-card" onclick="setRole('${option[0]}')">
          <span class="role-icon">${option[1]}</span>
          <h3>${option[2]}</h3>
          <p>${option[3]}</p>
          ${chip("Open view →")}
        </button>
      `).join("")}
    </div>
    <div class="privacy" style="margin-top:22px">
      <b>Privacy by role.</b>
      <span>A role changes available actions. It does not automatically provide access to a member’s information.</span>
    </div>
  `);
}

function signin(){
  return shell(`
    ${head(
      "Secure access",
      "Welcome to Pair",
      "Members can use a personal Pair account. Approved program staff can use organization sign-in."
    )}
    <div class="grid g2">
      <div class="card">
        <h2>Personal sign-in</h2>
        <div class="field"><label>Email address</label><input value="jordan@example.com"></div>
        <div class="field"><label>Password</label><input type="password" value="password"></div>
        <div class="actions">
          <button class="btn" onclick="setRole('member')">Sign in</button>
          <button class="btn secondary" onclick="toast('Secure sign-in link sent')">Email me a link</button>
        </div>
        <p class="sub">Face ID or device biometrics can be enabled after the first secure sign-in.</p>
      </div>

      <div class="card">
        <h2>Organization sign-in</h2>
        <p>For approved transition programs, schools and healthcare partners.</p>
        <button class="btn soft" onclick="showModal('roles')">Continue with organization</button>
        <div class="warning" style="margin-top:20px">
          <b>New to Pair?</b><br>
          A member creates their account first. Other roles join through a verified invitation.
        </div>
      </div>
    </div>
  `);
}

function memberHome(){
  return shell(`
    <div class="hero">
      <div class="eyebrow" style="color:#d8fff7">Tuesday · November 3</div>
      <h1>Good afternoon, Jordan.</h1>
      <p>Choose one thing. Details stay tucked away until you want them.</p>
      <div class="actions">
        <button class="btn" onclick="go('activity')">Continue laundry steps</button>
        <button class="btn secondary" onclick="go('checkin')">How am I doing?</button>
      </div>
    </div>

    <div class="grid g2" style="margin-top:20px">
      <div class="card">
        <div class="metric">
          <div>
            <div class="eyebrow">Your next step</div>
            <h2>Move the clothes to the dryer</h2>
          </div>
          ${chip("About 5 min","gold")}
        </div>
        <p>One picture step at a time. You can pause whenever you need.</p>
        <div class="progress"><span style="width:42%"></span></div>
        <div class="sub">Step 3 of 7</div>
      </div>

      <div class="card">
        <h2>Your day</h2>
        <div class="timeline-item">
          <div class="time">NOW</div><div class="line"><div class="dot"></div></div>
          <div><b>Finish one laundry step</b><div class="sub">About 5 minutes</div></div>
        </div>
        <div class="timeline-item">

      <div class="row"><b>Show picture steps</b>${toggle(true)}</div>
      <div class="row"><b>Read instructions aloud</b>${toggle(false)}</div>
      <div class="row"><b>Show one step at a time</b>${toggle(true)}</div>
      <button class="btn" onclick="toast('Presentation updated');closeModal()">Apply</button>
    `;
  }

  return `
    <div class="modal-back" onclick="if(event.target===this)closeModal()">
      <div class="modal">
        <div class="modal-head"><div></div><button class="close" onclick="closeModal()">×</button></div>
        ${content}
      </div>
    </div>
  `;
}

function render(){
  document.body.className=state.theme==="ocean"?"":state.theme;
  const pages={
    landing,
    roles:roleChooser,
    signin,
    home:memberHome,
    plan:memberPlan,
    activity,
    checkin,
    patterns,
    appointments,
    "appointment-prep":appointmentPrep,
    followup,
    circle,
    "member-settings":memberSettings,
    "coach-home":coachHome,
    learners,
    "learner-detail":learnerDetail,
    library:activityLibrary,
    "coach-settings":coachSettings,
    "health-home":healthHome,
    packet,
    nextsteps:nextSteps,
    "health-settings":healthSettings,
    "trusted-home":trustedHome,
    summary:sharedSummary,
    "trusted-settings":trustedSettings,
    "admin-home":adminHome,
    people,
    audit,
    "admin-settings":adminSettings
  };
  const page=pages[state.page]||landing;
  app.innerHTML=page()+modalContent();
}
render();
</script>
